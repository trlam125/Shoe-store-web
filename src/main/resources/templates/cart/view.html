<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giỏ hàng - LSHOE</title>
    <link rel="stylesheet" th:href="@{/css/style.css?v=7}">
</head>

<body>
    <div th:replace="~{fragments :: header}"></div>
    <section class="section">
        <div class="title-row">
            <div>
                <p class="eyebrow">Sẵn sàng thanh toán</p>
                <h1>Giỏ hàng của bạn</h1>
            </div><a class="btn secondary small" th:href="@{/products}">Tiếp tục mua sắm</a>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(items)}">
            <div class="empty-icon">🛒</div>
            <h3>Giỏ hàng đang trống</h3>
            <p>Hãy khám phá những mẫu giày mới nhất tại LSHOE.</p><a class="btn" th:href="@{/products}">Khám phá sản
                phẩm</a>
        </div>

        <div class="table-wrap" th:if="${!#lists.isEmpty(items)}">
            <table>
                <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Kích cỡ</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="i : ${items}">
                        <td><a class="cart-product" th:href="@{/products/{id}(id=${i.product.id})}"><img
                                    th:src="${i.product.imageUrl}" th:alt="${i.product.name}">
                                <div><b th:text="${i.product.name}"></b><span th:text="${i.product.brand}"></span></div>
                            </a></td>
                        <td><span class="size-pill" th:text="${i.selectedSize}">39</span></td>
                        <td th:text="${#numbers.formatDecimal(i.product.price,0,'COMMA',0,'POINT')} + 'đ'"></td>
                        <td>
                            <form class="quantity-form" th:action="@{/cart/update/{id}(id=${i.product.id})}"
                                method="post">
                                <input type="hidden" name="selectedSize" th:value="${i.selectedSize}">
                                <input type="number" name="quantity" min="0" th:max="${i.availableStock}"
                                    th:value="${i.quantity}">
                                <button class="btn-update-mole" type="submit" title="Cập nhật số lượng">
                                    <span class="btn-update-mole-inner">
                                        <span>Cập nhật</span>
                                        <svg class="btn-update-mole-arrow" fill="none" viewBox="0 0 24 24"
                                            stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
                                                d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                                        </svg>
                                    </span>
                                </button>
                            </form>
                        </td>
                        <td><b th:text="${#numbers.formatDecimal(i.subtotal,0,'COMMA',0,'POINT')} + 'đ'"></b></td>
                        <td>
                            <form th:action="@{/cart/remove/{id}(id=${i.product.id})}" method="post">
                                <input type="hidden" name="selectedSize" th:value="${i.selectedSize}">
                                <button class="bin-button" type="submit" title="Xóa khỏi giỏ hàng">
                                    <svg class="bin-top" viewBox="0 0 39 7" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <line y1="5" x2="39" y2="5" stroke="white" stroke-width="4"></line>
                                        <line x1="12" y1="1.5" x2="26.0357" y2="1.5" stroke="white" stroke-width="3">
                                        </line>
                                    </svg>
                                    <svg class="bin-bottom" viewBox="0 0 33 39" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <mask th:id="${'bin-mask-' + i.product.id + '-' + i.selectedSize}" fill="white">
                                            <path
                                                d="M0 0H33V35C33 37.2091 31.2091 39 29 39H4C1.79086 39 0 37.2091 0 35V0Z">
                                            </path>
                                        </mask>
                                        <path
                                            d="M0 0H33H0ZM37 35C37 39.4183 33.4183 43 29 43H4C-0.418278 43 -4 39.4183 -4 35H4H29H37ZM4 43C-0.418278 43 -4 39.4183 -4 35V0H4V35V43ZM37 0V35C37 39.4183 33.4183 43 29 43V35V0H37Z"
                                            fill="white"
                                            th:mask="${'url(#bin-mask-' + i.product.id + '-' + i.selectedSize + ')'}">
                                        </path>
                                        <path d="M12 6L12 29" stroke="white" stroke-width="4"></path>
                                        <path d="M21 6V29" stroke="white" stroke-width="4"></path>
                                    </svg>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="cart-summary" th:if="${!#lists.isEmpty(items)}">
            <div><span>Tổng thanh toán</span><strong
                    th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + 'đ'"></strong></div>
            <a class="cart-checkout-wrap" th:href="@{/checkout}" aria-label="Thanh toán">
                <span class="cart-checkout-btn">
                    <span class="cart-checkout-btn-text">Thanh toán</span>
                    <svg class="cart-checkout-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                        <line x1="2" y1="10" x2="22" y2="10"></line>
                        <circle cx="17" cy="15" r="1.5"></circle>
                    </svg>
                </span>
            </a>
        </div>
    </section>
    <div th:replace="~{fragments :: footer}"></div>
</body>

</html>
