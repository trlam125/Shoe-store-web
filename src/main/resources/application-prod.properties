# Production intentionally has no database credential defaults.
# DATABASE_URL should be the full Neon postgresql:// connection string.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# Vercel container functions have a short cold-start window.
# Keep startup light and initialize JPA/repositories only when first needed.
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
# The current Neon schema is already at V1. Avoid re-running Flyway on every cold start.
# Set FLYWAY_ENABLED=true only when intentionally running a new migration.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
app.data-seeder.enabled=${DATA_SEEDER_ENABLED:false}

spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}

spring.thymeleaf.cache=true
server.address=0.0.0.0
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Vercel production uses a separate AI project from the same Git repository.
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8001}
ai.service.api-key=${AI_INTERNAL_API_KEY:}
ai.service.autostart=false
ai.service.setup-venv=false

# Optional override for verification/password-reset links; Vercel system URL is used when exposed.
app.public-base-url=${APP_PUBLIC_BASE_URL:}

# Container filesystems are disposable. Persist administrator uploads in PostgreSQL.
app.product-image.storage=database

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:11MB}
app.product-image.max-bytes=${PRODUCT_IMAGE_MAX_BYTES:5242880}
app.ai-image.max-bytes=${AI_MAX_UPLOAD_BYTES:10485760}

app.environment=production
app.password-reset.log-link=false
app.email-verification.log-code=false

# Local tunnel helpers never run in production.
ngrok.tunnel.autostart=false
