# Production intentionally has no database credential defaults.
# On Northflank, alias the PostgreSQL addon's POSTGRES_URI to DATABASE_URL.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.thymeleaf.cache=true
server.address=0.0.0.0
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# FastAPI runs in the same Northflank container and listens on loopback only.
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8001}
ai.service.autostart=${AI_SERVICE_AUTOSTART:false}
ai.service.setup-venv=${AI_SERVICE_SETUP_VENV:false}

# Container filesystems are disposable. Persist administrator uploads in PostgreSQL.
app.product-image.storage=${PRODUCT_IMAGE_STORAGE:database}

# Generic production upload limits; these are no longer tied to any hosting provider.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:11MB}
app.product-image.max-bytes=${PRODUCT_IMAGE_MAX_BYTES:5242880}
app.ai-image.max-bytes=${AI_MAX_UPLOAD_BYTES:10485760}

app.environment=production
app.password-reset.log-link=false
app.email-verification.log-code=false

# Never expose production through local tunnel helpers unless explicitly overridden.
ngrok.tunnel.autostart=${NGROK_TUNNEL_AUTOSTART:false}
