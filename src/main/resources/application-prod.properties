# Production intentionally has no database credential defaults.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.thymeleaf.cache=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
ai.service.autostart=${AI_SERVICE_AUTOSTART:false}

# Container deployments are stateless. Persist administrator uploads in PostgreSQL.
app.product-image.storage=${PRODUCT_IMAGE_STORAGE:database}

# Vercel request bodies are limited, so keep multipart payloads below the platform limit.
spring.servlet.multipart.max-file-size=${VERCEL_MAX_UPLOAD_SIZE:4MB}
spring.servlet.multipart.max-request-size=${VERCEL_MAX_REQUEST_SIZE:4500KB}
app.product-image.max-bytes=${PRODUCT_IMAGE_MAX_BYTES:4000000}
app.ai-image.max-bytes=${AI_MAX_UPLOAD_BYTES:4000000}

app.environment=production
app.password-reset.log-link=false
app.email-verification.log-code=false

# Never expose production automatically unless explicitly overridden.
ngrok.tunnel.autostart=${NGROK_TUNNEL_AUTOSTART:false}
