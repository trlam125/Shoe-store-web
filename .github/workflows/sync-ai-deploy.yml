name: Sync AI deploy branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-ai-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main to ai-deploy
        run: |
          git push origin HEAD:refs/heads/ai-deploy --force
